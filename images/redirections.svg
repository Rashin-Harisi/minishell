<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-label="Redirections and File Descriptors">

<style>
  .bg { fill: #0d1117; }
  .panel { fill: #161b22; stroke: #30363d; stroke-width: 2; }
  .node { fill: #21262d; stroke: #58a6ff; stroke-width: 2; }
  .node-alt { fill: #21262d; stroke: #3fb950; stroke-width: 2; }
  .node-warn { fill: #21262d; stroke: #d29922; stroke-width: 2; }
  .text { fill: #f0f6fc; font: 600 18px Arial, sans-serif; }
  .small { fill: #8b949e; font: 14px Arial, sans-serif; }
  .title { fill: #f0f6fc; font: 700 28px Arial, sans-serif; }
  .arrow { stroke: #8b949e; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
  .pipe { stroke: #58a6ff; stroke-width: 4; fill: none; marker-end: url(#arrowBlue); }
  .fd { fill: #79c0ff; font: 600 14px monospace; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#8b949e"/>
  </marker>
  <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#58a6ff"/>
  </marker>
</defs>

<rect class="bg" width="1200" height="690" rx="18"/>
<text class="title" x="600.0" y="44" text-anchor="middle">Redirections and File Descriptors</text>
<rect class="node" x="90" y="150" width="210" height="100" rx="12"/><text class="text" x="195.0" y="198.0" text-anchor="middle">&lt; input</text><text class="small" x="195.0" y="220.0" text-anchor="middle">open(O_RDONLY)</text><path class="arrow" d="M195,250 L195,330"/><rect class="node-alt" x="90" y="330" width="210" height="85" rx="12"/><text class="text" x="195.0" y="370.5" text-anchor="middle">file → STDIN</text><text class="small" x="195.0" y="392.5" text-anchor="middle">dup2()</text><rect class="node" x="330" y="150" width="210" height="100" rx="12"/><text class="text" x="435.0" y="198.0" text-anchor="middle">&gt; output</text><text class="small" x="435.0" y="220.0" text-anchor="middle">open(O_TRUNC)</text><path class="arrow" d="M435,250 L435,330"/><rect class="node-alt" x="330" y="330" width="210" height="85" rx="12"/><text class="text" x="435.0" y="370.5" text-anchor="middle">STDOUT → file</text><text class="small" x="435.0" y="392.5" text-anchor="middle">dup2()</text><rect class="node" x="570" y="150" width="210" height="100" rx="12"/><text class="text" x="675.0" y="198.0" text-anchor="middle">&gt;&gt; append</text><text class="small" x="675.0" y="220.0" text-anchor="middle">open(O_APPEND)</text><path class="arrow" d="M675,250 L675,330"/><rect class="node-alt" x="570" y="330" width="210" height="85" rx="12"/><text class="text" x="675.0" y="370.5" text-anchor="middle">STDOUT → file</text><text class="small" x="675.0" y="392.5" text-anchor="middle">dup2()</text><rect class="node" x="810" y="150" width="210" height="100" rx="12"/><text class="text" x="915.0" y="198.0" text-anchor="middle">&lt;&lt; heredoc</text><text class="small" x="915.0" y="220.0" text-anchor="middle">temporary pipe/file</text><path class="arrow" d="M915,250 L915,330"/><rect class="node-alt" x="810" y="330" width="210" height="85" rx="12"/><text class="text" x="915.0" y="370.5" text-anchor="middle">heredoc → STDIN</text><text class="small" x="915.0" y="392.5" text-anchor="middle">dup2()</text><rect class="node-warn" x="280" y="500" width="640" height="90" rx="12"/><text class="text" x="600.0" y="543.0" text-anchor="middle">Executor</text><text class="small" x="600.0" y="565.0" text-anchor="middle">save original descriptors → apply redirections → execute → restore</text><path class="arrow" d="M195,415 L430,500"/><path class="arrow" d="M435,415 L520,500"/><path class="arrow" d="M675,415 L680,500"/><path class="arrow" d="M915,415 L770,500"/></svg>