<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="Parsing Flow">

<style>
  .bg { fill: #0d1117; }
  .panel { fill: #161b22; stroke: #30363d; stroke-width: 2; }
  .node { fill: #21262d; stroke: #58a6ff; stroke-width: 2; }
  .node-alt { fill: #21262d; stroke: #3fb950; stroke-width: 2; }
  .node-warn { fill: #21262d; stroke: #d29922; stroke-width: 2; }
  .text { fill: #f0f6fc; font: 600 18px Arial, sans-serif; }
  .small { fill: #8b949e; font: 14px Arial, sans-serif; }
  .title { fill: #f0f6fc; font: 700 28px Arial, sans-serif; }
  .arrow { stroke: #8b949e; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
  .pipe { stroke: #58a6ff; stroke-width: 4; fill: none; marker-end: url(#arrowBlue); }
  .fd { fill: #79c0ff; font: 600 14px monospace; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#8b949e"/>
  </marker>
  <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#58a6ff"/>
  </marker>
</defs>

<rect class="bg" width="1200" height="620" rx="18"/>
<text class="title" x="600.0" y="44" text-anchor="middle">Parsing Flow</text>
<rect class="node-alt" x="80" y="235" width="160" height="105" rx="12"/><text class="text" x="160.0" y="285.5" text-anchor="middle">Input</text><text class="small" x="160.0" y="307.5" text-anchor="middle">raw command line</text><path class="arrow" d="M240,287 L310,287"/><rect class="node" x="310" y="235" width="160" height="105" rx="12"/><text class="text" x="390.0" y="285.5" text-anchor="middle">Tokenize</text><text class="small" x="390.0" y="307.5" text-anchor="middle">words and operators</text><path class="arrow" d="M470,287 L540,287"/><rect class="node" x="540" y="235" width="160" height="105" rx="12"/><text class="text" x="620.0" y="285.5" text-anchor="middle">Validate</text><text class="small" x="620.0" y="307.5" text-anchor="middle">syntax and quotes</text><path class="arrow" d="M700,287 L770,287"/><rect class="node" x="770" y="235" width="160" height="105" rx="12"/><text class="text" x="850.0" y="285.5" text-anchor="middle">Expand</text><text class="small" x="850.0" y="307.5" text-anchor="middle">variables and status</text><path class="arrow" d="M930,287 L1000,287"/><rect class="node-alt" x="1000" y="235" width="160" height="105" rx="12"/><text class="text" x="1080.0" y="285.5" text-anchor="middle">Build Commands</text><text class="small" x="1080.0" y="307.5" text-anchor="middle">argv + redirections</text><rect class="node-warn" x="310" y="425" width="620" height="80" rx="12"/><text class="text" x="620.0" y="463.0" text-anchor="middle">Result</text><text class="small" x="620.0" y="485.0" text-anchor="middle">structured command list ready for execution</text><path class="arrow" d="M1080,340 L1080,390"/><path class="arrow" d="M1080,390 C1080,465 930,465 930,465"/></svg>