<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="560" viewBox="0 0 1300 560" role="img" aria-label="Pipeline Execution">

<style>
  .bg { fill: #0d1117; }
  .panel { fill: #161b22; stroke: #30363d; stroke-width: 2; }
  .node { fill: #21262d; stroke: #58a6ff; stroke-width: 2; }
  .node-alt { fill: #21262d; stroke: #3fb950; stroke-width: 2; }
  .node-warn { fill: #21262d; stroke: #d29922; stroke-width: 2; }
  .text { fill: #f0f6fc; font: 600 18px Arial, sans-serif; }
  .small { fill: #8b949e; font: 14px Arial, sans-serif; }
  .title { fill: #f0f6fc; font: 700 28px Arial, sans-serif; }
  .arrow { stroke: #8b949e; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
  .pipe { stroke: #58a6ff; stroke-width: 4; fill: none; marker-end: url(#arrowBlue); }
  .fd { fill: #79c0ff; font: 600 14px monospace; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#8b949e"/>
  </marker>
  <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#58a6ff"/>
  </marker>
</defs>

<rect class="bg" width="1300" height="560" rx="18"/>
<text class="title" x="650.0" y="44" text-anchor="middle">Pipeline Execution</text>
<rect class="node-alt" x="90" y="190" width="250" height="100" rx="12"/><text class="text" x="215.0" y="238.0" text-anchor="middle">cmd1</text><text class="small" x="215.0" y="260.0" text-anchor="middle">forked child process</text><rect class="node-alt" x="500" y="190" width="250" height="100" rx="12"/><text class="text" x="625.0" y="238.0" text-anchor="middle">cmd2</text><text class="small" x="625.0" y="260.0" text-anchor="middle">forked child process</text><rect class="node-alt" x="910" y="190" width="250" height="100" rx="12"/><text class="text" x="1035.0" y="238.0" text-anchor="middle">cmd3</text><text class="small" x="1035.0" y="260.0" text-anchor="middle">forked child process</text><path class="pipe" d="M340,240 L500,240"/><path class="pipe" d="M750,240 L910,240"/><text class="fd" x="420" y="220" text-anchor="middle">pipefd[1] → pipefd[0]</text><text class="fd" x="830" y="220" text-anchor="middle">pipefd[1] → pipefd[0]</text><path class="arrow" d="M215,290 L215,390"/><path class="arrow" d="M625,290 L625,390"/><path class="arrow" d="M1035,290 L1035,390"/><rect class="node" x="90" y="390" width="250" height="70" rx="12"/><text class="text" x="215.0" y="423.0" text-anchor="middle">stdin / stdout</text><text class="small" x="215.0" y="445.0" text-anchor="middle">redirected with dup2()</text><rect class="node" x="500" y="390" width="250" height="70" rx="12"/><text class="text" x="625.0" y="423.0" text-anchor="middle">stdin / stdout</text><text class="small" x="625.0" y="445.0" text-anchor="middle">both ends connected</text><rect class="node" x="910" y="390" width="250" height="70" rx="12"/><text class="text" x="1035.0" y="423.0" text-anchor="middle">stdin / stdout</text><text class="small" x="1035.0" y="445.0" text-anchor="middle">final output</text></svg>