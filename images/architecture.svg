<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="Minishell Architecture">

<style>
  .bg { fill: #0d1117; }
  .panel { fill: #161b22; stroke: #30363d; stroke-width: 2; }
  .node { fill: #21262d; stroke: #58a6ff; stroke-width: 2; }
  .node-alt { fill: #21262d; stroke: #3fb950; stroke-width: 2; }
  .node-warn { fill: #21262d; stroke: #d29922; stroke-width: 2; }
  .text { fill: #f0f6fc; font: 600 18px Arial, sans-serif; }
  .small { fill: #8b949e; font: 14px Arial, sans-serif; }
  .title { fill: #f0f6fc; font: 700 28px Arial, sans-serif; }
  .arrow { stroke: #8b949e; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
  .pipe { stroke: #58a6ff; stroke-width: 4; fill: none; marker-end: url(#arrowBlue); }
  .fd { fill: #79c0ff; font: 600 14px monospace; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#8b949e"/>
  </marker>
  <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#58a6ff"/>
  </marker>
</defs>

<rect class="bg" width="1200" height="760" rx="18"/>
<text class="title" x="600.0" y="44" text-anchor="middle">Minishell Architecture</text>
<rect class="node-alt" x="470" y="75" width="260" height="70" rx="12"/><text class="text" x="600.0" y="108.0" text-anchor="middle">User Input</text><text class="small" x="600.0" y="130.0" text-anchor="middle">readline()</text><path class="arrow" d="M600,145 L600,185"/><rect class="node" x="470" y="185" width="260" height="70" rx="12"/><text class="text" x="600.0" y="218.0" text-anchor="middle">Tokenizer</text><text class="small" x="600.0" y="240.0" text-anchor="middle">lexical analysis</text><path class="arrow" d="M600,255 L600,295"/><rect class="node" x="470" y="295" width="260" height="70" rx="12"/><text class="text" x="600.0" y="328.0" text-anchor="middle">Syntax Validation</text><text class="small" x="600.0" y="350.0" text-anchor="middle">quotes, pipes, redirections</text><path class="arrow" d="M600,365 L600,405"/><rect class="node" x="470" y="405" width="260" height="70" rx="12"/><text class="text" x="600.0" y="438.0" text-anchor="middle">Command Builder</text><text class="small" x="600.0" y="460.0" text-anchor="middle">command linked list</text><path class="arrow" d="M600,475 L600,515"/><rect class="node-warn" x="170" y="515" width="260" height="85" rx="12"/><text class="text" x="300.0" y="555.5" text-anchor="middle">Expansion</text><text class="small" x="300.0" y="577.5" text-anchor="middle">$VAR, $?, quote removal</text><rect class="node-warn" x="470" y="515" width="260" height="85" rx="12"/><text class="text" x="600.0" y="555.5" text-anchor="middle">Heredoc Preparation</text><text class="small" x="600.0" y="577.5" text-anchor="middle">temporary input streams</text><rect class="node-alt" x="770" y="515" width="260" height="85" rx="12"/><text class="text" x="900.0" y="555.5" text-anchor="middle">Execution Engine</text><text class="small" x="900.0" y="577.5" text-anchor="middle">builtins, fork, execve</text><path class="arrow" d="M600,475 L300,515"/><path class="arrow" d="M600,475 L900,515"/><path class="arrow" d="M430,557 L470,557"/><path class="arrow" d="M730,557 L770,557"/><path class="arrow" d="M900,600 L900,650"/><rect class="node-alt" x="770" y="650" width="260" height="65" rx="12"/><text class="text" x="900.0" y="680.5" text-anchor="middle">Exit Status</text><text class="small" x="900.0" y="702.5" text-anchor="middle">next prompt</text></svg>