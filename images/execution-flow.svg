<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Execution Flow">

<style>
  .bg { fill: #0d1117; }
  .panel { fill: #161b22; stroke: #30363d; stroke-width: 2; }
  .node { fill: #21262d; stroke: #58a6ff; stroke-width: 2; }
  .node-alt { fill: #21262d; stroke: #3fb950; stroke-width: 2; }
  .node-warn { fill: #21262d; stroke: #d29922; stroke-width: 2; }
  .text { fill: #f0f6fc; font: 600 18px Arial, sans-serif; }
  .small { fill: #8b949e; font: 14px Arial, sans-serif; }
  .title { fill: #f0f6fc; font: 700 28px Arial, sans-serif; }
  .arrow { stroke: #8b949e; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
  .pipe { stroke: #58a6ff; stroke-width: 4; fill: none; marker-end: url(#arrowBlue); }
  .fd { fill: #79c0ff; font: 600 14px monospace; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#8b949e"/>
  </marker>
  <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#58a6ff"/>
  </marker>
</defs>

<rect class="bg" width="1200" height="720" rx="18"/>
<text class="title" x="600.0" y="44" text-anchor="middle">Execution Flow</text>
<rect class="node" x="470" y="80" width="260" height="70" rx="12"/><text class="text" x="600.0" y="113.0" text-anchor="middle">Command List</text><text class="small" x="600.0" y="135.0" text-anchor="middle">prepared by parser</text><path class="arrow" d="M600,150 L600,200"/><rect class="node-alt" x="470" y="200" width="260" height="75" rx="12"/><text class="text" x="600.0" y="235.5" text-anchor="middle">Execution Engine</text><text class="small" x="600.0" y="257.5" text-anchor="middle">single command or pipeline</text><path class="arrow" d="M600,275 L330,340"/><path class="arrow" d="M600,275 L870,340"/><rect class="node-warn" x="180" y="340" width="300" height="90" rx="12"/><text class="text" x="330.0" y="383.0" text-anchor="middle">Parent Builtin</text><text class="small" x="330.0" y="405.0" text-anchor="middle">cd, export, unset, exit</text><rect class="node" x="720" y="340" width="300" height="90" rx="12"/><text class="text" x="870.0" y="383.0" text-anchor="middle">Child Process</text><text class="small" x="870.0" y="405.0" text-anchor="middle">fork()</text><path class="arrow" d="M870,430 L870,485"/><rect class="node" x="720" y="485" width="300" height="90" rx="12"/><text class="text" x="870.0" y="528.0" text-anchor="middle">External Command</text><text class="small" x="870.0" y="550.0" text-anchor="middle">PATH lookup + execve()</text><path class="arrow" d="M330,430 L330,620"/><path class="arrow" d="M870,575 L870,620"/><rect class="node-alt" x="390" y="620" width="420" height="65" rx="12"/><text class="text" x="600.0" y="650.5" text-anchor="middle">Update $? and restore file descriptors</text></svg>