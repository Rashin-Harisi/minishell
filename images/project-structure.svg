<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="Project Structure">

<style>
  .bg { fill: #0d1117; }
  .panel { fill: #161b22; stroke: #30363d; stroke-width: 2; }
  .node { fill: #21262d; stroke: #58a6ff; stroke-width: 2; }
  .node-alt { fill: #21262d; stroke: #3fb950; stroke-width: 2; }
  .node-warn { fill: #21262d; stroke: #d29922; stroke-width: 2; }
  .text { fill: #f0f6fc; font: 600 18px Arial, sans-serif; }
  .small { fill: #8b949e; font: 14px Arial, sans-serif; }
  .title { fill: #f0f6fc; font: 700 28px Arial, sans-serif; }
  .arrow { stroke: #8b949e; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
  .pipe { stroke: #58a6ff; stroke-width: 4; fill: none; marker-end: url(#arrowBlue); }
  .fd { fill: #79c0ff; font: 600 14px monospace; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#8b949e"/>
  </marker>
  <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#58a6ff"/>
  </marker>
</defs>

<rect class="bg" width="1200" height="760" rx="18"/>
<text class="title" x="600.0" y="44" text-anchor="middle">Project Structure</text>
<rect class="node-alt" x="470" y="80" width="260" height="70" rx="12"/><text class="text" x="600.0" y="113.0" text-anchor="middle">minishell</text><text class="small" x="600.0" y="135.0" text-anchor="middle">C / POSIX</text><path class="arrow" d="M600,150 L600,200"/><rect class="node" x="70" y="240" width="220" height="110" rx="12"/><text class="text" x="180.0" y="293.0" text-anchor="middle">parsing/</text><text class="small" x="180.0" y="315.0" text-anchor="middle">tokenizer, validation, / command construction</text><path class="arrow" d="M600,200 L180,240"/><rect class="node" x="350" y="240" width="220" height="110" rx="12"/><text class="text" x="460.0" y="293.0" text-anchor="middle">executing/</text><text class="small" x="460.0" y="315.0" text-anchor="middle">fork, execve, / pipelines, redirections</text><path class="arrow" d="M600,200 L460,240"/><rect class="node" x="630" y="240" width="220" height="110" rx="12"/><text class="text" x="740.0" y="293.0" text-anchor="middle">builtins/</text><text class="small" x="740.0" y="315.0" text-anchor="middle">echo, cd, pwd, / export, unset, env, exit</text><path class="arrow" d="M600,200 L740,240"/><rect class="node" x="910" y="240" width="220" height="110" rx="12"/><text class="text" x="1020.0" y="293.0" text-anchor="middle">heredoc/</text><text class="small" x="1020.0" y="315.0" text-anchor="middle">delimiter handling, / input preparation</text><path class="arrow" d="M600,200 L1020,240"/><rect class="node-warn" x="210" y="500" width="220" height="110" rx="12"/><text class="text" x="320.0" y="553.0" text-anchor="middle">env/</text><text class="small" x="320.0" y="575.0" text-anchor="middle">environment linked list</text><path class="arrow" d="M600,200 L320,500"/><rect class="node-warn" x="490" y="500" width="220" height="110" rx="12"/><text class="text" x="600.0" y="553.0" text-anchor="middle">signals/</text><text class="small" x="600.0" y="575.0" text-anchor="middle">interactive and child signals</text><path class="arrow" d="M600,200 L600,500"/><rect class="node-warn" x="770" y="500" width="220" height="110" rx="12"/><text class="text" x="880.0" y="553.0" text-anchor="middle">utils/ + libft/</text><text class="small" x="880.0" y="575.0" text-anchor="middle">shared helpers and memory</text><path class="arrow" d="M600,200 L880,500"/></svg>